<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biuuka · 网站授权</title><link rel="stylesheet" href="/console.css"><script src="/pair.js" defer></script></head><body><main class="pair-shell"><p class="brand">◈ Biuuka</p><section><p class="eyebrow">本机授权 · 请核对网站</p><h1>由你决定，谁能连接。</h1><strong id="origin" class="pair-origin"></strong><p>确认权限和时长后，把本页滚动码输入申请网站。切勿替陌生网站完成授权。</p><label>授权有效期<select id="duration"><option value="300">5 分钟</option><option value="1800">30 分钟</option><option value="3600" selected>1 小时</option><option value="86400">1 天</option><option value="604800">7 天</option><option value="2592000">30 天</option><option value="custom">自定义分钟数</option><option value="forever">长期授信（直到撤销）</option></select></label><label id="custom-duration" hidden>分钟数（至少 5 分钟）<input id="minutes" type="number" min="5" max="525600" value="120"></label><label><input type="checkbox" name="scope" value="account" checked> 读取账户、额度与网络检测信息</label><label><input type="checkbox" name="scope" value="test"> 读取模型并发送固定测试（消耗额度）</label><label><input type="checkbox" name="scope" value="notify"> 推送桌面通知（还需本机总开关允许）</label><button id="approve">确认权限并显示授权码</button><div id="code-section" hidden><div id="code" class="code">------</div><p id="countdown"></p><p class="muted">代码每 30 秒更换，仅当前码有效；申请 5 分钟内有效，最多尝试 5 次。</p></div><p id="status" role="status"></p><button id="cancel" class="secondary">取消申请</button><p><a href="/console" target="_blank" rel="noopener">在控制台查看和撤销授权 ↗</a></p></section></main></body></html>
